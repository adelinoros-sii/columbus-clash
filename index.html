const LEVELS=[{name:'EASY',react:26,block:.15,aa:.12,combo:.35,sup:.3},{name:'NORMAL',react:15,block:.45,aa:.4,combo:.65,sup:.6},{name:'HARD',react:8,block:.78,aa:.72,combo:.92,sup:.9}];
function aiInput(f,opp,ai){const inp=f.inp;inp.pr={};const L=ai.lvl;const dx=opp.x-f.x,dist=Math.abs(dx)/KS;const toward=dx>0?'right':'left',away=dx>0?'left':'right';
 inp.left=inp.right=inp.up=inp.down=false;
 if(ai.holdT>0){ai.holdT--;for(const k in ai.hold)inp[k]=ai.hold[k];}
 const press=(b,dirs)=>{if(b==='p')b=chance(.5)?'lp':'hp';else if(b==='k')b=chance(.5)?'lk':'hk';if(dirs)for(const k in dirs)inp[k]=dirs[k];inp.pr[b]=true;};
 if(game.phase==='finish')return;
 // chain plan
 if(ai.plan.length&&f.state==='attack'&&f.connected&&f.moveT>=f.move.su+1&&f.mkey!==ai.chainFrom){ai.chainFrom=f.mkey;const b=ai.plan.shift();if(b==='S')press('s',{down:ai.planDown});else if(b==='SF')press('s',{[toward]:true});else press(b.toLowerCase());return;}
 if(f.state==='attack'&&!f.connected&&f.move&&f.moveT>f.move.su+f.move.ac)ai.plan=[];
 if(ai.plan.length&&!['attack','jump'].includes(f.state))ai.plan=[];
 if(f.state==='jump'&&ai.airAtk&&dist<44&&f.vy>-1){press(chance(.5)?'k':'p');ai.airAtk=false;return;}
 if(!game.control)return;
 if(!(f.actionable()||f.state==='jump'))return;
 // reactive defence
 const oppAtk=opp.state==='attack'&&opp.move&&dist<80&&opp.moveT<opp.move.su+opp.move.ac;
 const projNear=projs.find(p=>p.owner===opp&&Math.abs(p.x-f.x)<90&&Math.sign(p.vx)===Math.sign(f.x-p.x));
 if((oppAtk||projNear)&&ai.def<=0){ai.def=12;if(chance(L.block)){if(projNear&&chance(.4)&&dist>90){press('up',{up:true,[toward]:true});ai.airAtk=true;return;}
   ai.hold={[away]:true,down:!!(opp.move&&opp.move.low)||(!(opp.move&&opp.move.overhead)&&chance(.3))};ai.holdT=16;return;}}
 if(ai.def>0)ai.def--;
 if(opp.state==='jump'&&dist<70&&opp.vy>-2&&ai.aa<=0){ai.aa=20;if(chance(L.aa)){if(chance(.5))press('hp',{down:true});else press('s',{down:true});return;}}
 if(ai.aa>0)ai.aa--;
 if(--ai.cool>0)return;ai.cool=L.react+Math.floor(rnd(0,L.react));
 const k=f.ch.ai||f.key;
 if(f.meter>=100&&chance(L.sup)&&(dist<64||(k==='serj')||(k==='odi')||(k==='ade'&&dist<180))&&opp.state!=='down'&&opp.state!=='getup'){press('sup');return;}
 if(['down','getup'].includes(opp.state)){ai.hold={[away]:chance(.4),down:false};ai.holdT=10;return;}
 if(dist>140){const r=Math.random();
  if(k!=='ade'&&r<.45&&!projs.some(p=>p.owner===f)){press('s');return;}
  if(k==='ade'&&r<.2){press('s',{[toward]:true});return;}
  if(r<.6){ai.hold={[toward]:true};ai.holdT=24;return;}
  if(r<.75){press('up',{up:true,[toward]:true});ai.airAtk=true;return;}
  ai.hold={};ai.holdT=8;return;}
 if(dist>36){const r=Math.random();if(dist<50&&r<.5){ai.hold={[toward]:true};ai.holdT=6;ai.cool=2;return;}
  if(k==='alen'&&r<.18){press('s',{[toward]:true});return;}
  if(k==='serj'&&r<.14){press('s',{[toward]:true});return;}
  if(k==='odi'&&r<.16){press('s',{[toward]:true});return;}
  if(k==='ade'&&r<.2&&dist<110){press('s');return;}
  if(k!=='ade'&&r<.3&&dist>90&&!projs.some(p=>p.owner===f)){press('s');return;}
  if(r<.42){press('up',{up:true,[toward]:true});ai.airAtk=true;return;}
  ai.hold={[toward]:true};ai.holdT=14+Math.floor(rnd(0,14));return;}
 // close range
 const r=Math.random();
 if(r<L.combo){const strings=Object.keys(f.ch.dial||{}).map(s=>s.split(',')).concat([['LP','LP','S'],['LK','LK','S']]);
  const st=pick(strings);ai.planDown=chance(.5);press(st[0].toLowerCase());ai.plan=st.slice(1);ai.chainFrom='';return;}
 if(r<L.combo+.1){press('k',{down:true});return;}
 if(k==='ade'&&r<L.combo+.22){press('s',{down:true});return;}
 if(r<L.combo+.3){press(chance(.5)?'p':'k',{[toward]:true});return;}
 ai.hold={[away]:true};ai.holdT=12;
}
function newAI(lvl){return {lvl:LEVELS[lvl],plan:[],cool:20,holdT:0,hold:{},def:0,aa:0,airAtk:false,planDown:false};}

 const gp0=readPad(0),gp1=readPad(1);const e=(gp,i,n)=>gp&&gp[n]&&!padPrev[i][n];const e2=(i,n)=>e(i?gp1:gp0,i,n);

 if(!game.el)game.el=[null,null];const elc=(i,u,dn)=>{if(game.lock[i]||!(u||dn))return;const k=LIST[game.sel[i]];if(!SLOT[k])return;const cur=EL_ORDER.indexOf(game.el[i]||SIG[k]),n=EL_ORDER.length;game.el[i]=EL_ORDER.at((cur+(dn?1:n-1))%n);sfx.move();};

 if(game.mode!=='online'&&menuKey('back')){if(game.selPhase>0&&!two){game.selPhase--;game.lock[game.selPhase]=false;sfx.move();}else if(two&&(game.lock[0]||game.lock[1])){game.lock=[false,false];}else go('title');return;}
 if(game.mode==='online'){if(netSelect(LIST,P1L||P2L||e(gp0,0,'left'),P1R||P2R||e(gp0,0,'right'),P1OK||P2OK||e(gp0,0,'ok'),P1U||P2U,P1D||P2D,elc)===false)return;}

 if(game.selMsgT>0)game.selMsgT--;
 const np=story?1:2;

  const d=selDummies[i];d.shadow=!isUnlocked(k);d.anim++;d.state=game.lock[i]&&!d.shadow?'win':'idle';d.animatePose(null);}

 if(game.demo&&(pressed.size>0)){go('title');return;}
 if(!game.demo&&game.mode!=='online'&&menuKey('back')){if(!game.demo){game.paused=!game.paused;game.pauseIdx=0;sfx.move();}}
 if(game.paused){if(menuKey('up','down')){game.pauseIdx=1-game.pauseIdx;sfx.move();}if(menuKey('ok')){sfx.ok();if(game.pauseIdx===0)game.paused=false;else{game.paused=false;go('title');}}return;}
 if(pressed.has('KeyM')){musicOn=!musicOn;saveOpt();}
 // inputs
 const two=game.mode==='2p'&&!game.demo;
 if(game.mode==='online'&&NET.cur){unpackInput(a.inp,NET.cur[0]);unpackInput(b.inp,NET.cur[1]);}
 else{if(a.ai)aiInput(a,b,a.ai);else readInput(a.inp,two?MAP1:MAPALL,0);
 if(b.ai)aiInput(b,a,b.ai);else readInput(b.inp,MAP2,1);}
 pushDir(a.inp,a.facing);pushDir(b.inp,b.facing);bufferPresses(a.inp);bufferPresses(b.inp);
 if(game.superFreeze>0){game.superFreeze--;const s=game.superBy;punch(1.06,s.x,s.y-50);s.anim++;s.animatePose(s===a?b:a);updateParts();if(frame%3===0)burst(s.x+rnd(-12,12),s.y-rnd(10,50),2,[s.pal.aura,'#ffffff'],1,14,-.1,1);return;}

 if(game.phase==='fight'){if(++game.tick>=60){game.tick=0;game.timer--;if(game.timer<=0){game.timer=0;game.phase='ko';game.phaseT=0;game.control=false;game.banner='TIME OVER';game.bannerT=110;sfx.bell();}}}
 if(game.phase==='finish'){const A=game.finAtt,D=game.finDef,ip=A.inp;
  if(D.state==='dizzy'&&game.phaseT%30===0)pop('?',D.x,D.y-112,'#ffd23a',30,8);
  const trig=A.ai?game.phaseT===80:((ip.bt.hp!=null&&frame-ip.bt.hp<=3&&motion(ip,[2,5,2],45))||(ip.bt.sup!=null&&frame-ip.bt.sup<=3));
  if(trig&&A.actionable()&&D.state==='dizzy'){game.phase='closing';game.phaseT=0;game.control=false;A.state='intro';A.anim=0;A.glow=150;A.facing=D.x>=A.x?1:-1;game.banner='';game.bannerT=0;sfx.superGo();flashA=.6;}
  else if(game.phaseT>=330&&D.state==='dizzy'){D.state='fall';D.vy=-2;D.vx=(D.x>=A.x?1:-1)*1.2;D.y=FLOOR-1;game.phase='ko';game.phaseT=0;game.control=false;game.banner='K.O.';game.bannerT=100;sfx.ko();}}
 a.update(b);b.update(a);
 // push apart
 const dx=b.x-a.x,dy=Math.abs(a.y-b.y);if(Math.abs(dx)<36&&dy<70&&!['down','ko','getup'].includes(a.state)&&!['down','ko','getup'].includes(b.state)&&a.alpha>.5&&b.alpha>.5){const ov=(36-Math.abs(dx))/2,s=dx>=0?1:-1;a.x-=ov*s;b.x+=ov*s;
  if(a.x<LW){b.x+=LW-a.x;a.x=LW;}if(b.x<LW){a.x+=LW-b.x;b.x=LW;}if(a.x>RW){b.x-=a.x-RW;a.x=RW;}if(b.x>RW){a.x-=b.x-RW;b.x=RW;}}
 updateProjs(game.f);updateParts();
 if(game.phase==='closing'){const t=game.phaseT,A=game.finAtt,D=game.finDef;
  if(t<44){shake=Math.max(shake,1);if(t%3===0)burst(D.x+rnd(-14,14),D.y-rnd(10,80),3,['#b48cff','#ff7a1a','#ffffff'],1.6,18,-.06,2);}
  if(t===44){D.pumpkin=true;D.vx=0;flashA=1;shake=12;sfx.thud();sfx.h();burst(D.x,D.y-40,46,['#ff7a1a','#ffd23a','#3a6b2a','#ffffff'],4.2,42,.06,2);burst(D.x,D.y-30,24,['#6a4a5a','#b48cff','#e0d0ff'],2,50,-.05,3);game.banner='PUMPKINED!';game.bannerT=150;}
  if(t===160){A.state='idle';game.phase='ko';game.phaseT=60;game.control=false;}}
 if(game.phase==='ko'){
  const t=game.phaseT;
  if(t===70){const [h0,h1]=[a.hp/a.ch.hp,b.hp/b.ch.hp];let w=-1;if(a.hp<=0&&b.hp<=0)w=-1;else if(b.hp<=0)w=0;else if(a.hp<=0)w=1;else if(h0>h1)w=0;else if(h1>h0)w=1;
   game.roundWinner=w;if(w>=0){game.wins[w]++;const wf=game.f[w];wf.score+=game.timer*100+(wf.hp>=wf.ch.hp?20000:0);}}

  if(t===110){const w=game.roundWinner;game.banner=w<0?'DRAW':(game.f[w].ch.name+' WINS');game.bannerT=110;}
  if(t>=230){if(game.wins[0]>=2||game.wins[1]>=2){game.winner=game.wins[0]>=2?0:1;if(game.demo){go('title');return;}if(game.mode==='story'&&game.winner===0){storyAfterWin();return;}game.scene='result';game.resIdx=0;sfx.win();const wf=game.f[game.winner];selDummies[0]=dummy(wf.key,wf.alt,1);selDummies[0].state='win';}
   else{game.round++;startRound();}}
 }

}
